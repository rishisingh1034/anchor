version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install --frozen-lockfile
    build:
      commands:
        - env | grep -E "^(GITHUB_CLIENT_ID|GITHUB_CLIENT_SECRET|NEXTAUTH_SECRET|NEXTAUTH_URL|AWS_REGION|BEDROCK_MODEL_ID|DEPLOYMENTS_TABLE|DEPLOY_BUCKET_PREFIX)=" >> .env.production
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
